<mdc-dialog-title>
    File: ${fileDoc.name}
</mdc-dialog-title>
<mdc-dialog-content>
    <div id="forUpload"></div>
    <div if.bind="compress" style="margin-top: 1em;">
        <div style="margin-bottom: 0.5em;">
            <label for="targetWidthInput">Target Width:</label>
            <input id="targetWidthInput" type="number" value.bind="targetWidth" min="1"
                input.trigger="validateTargetWidth()" style="margin-left: 0.5em; width: 6em;" />
            <span style="color: red; font-size: 0.9em;" if.bind="targetWidthError">${targetWidthError}</span>
        </div>
        <div>
            <label for="qualityInput">Quality:</label>
            <input id="qualityInput" type="number" value.bind="quality" min="0" max="1" step="0.01"
                input.trigger="validateQuality()" style="margin-left: 0.5em; width: 6em;" />
            <span style="color: red; font-size: 0.9em;" if.bind="qualityError">${qualityError}</span>
        </div>
    </div>
</mdc-dialog-content>
<mdc-dialog-actions>
    <mdc-form-field align-start class="compress-switch-left">
        <button mdc-switch selected.bind="compress"></button>
        <label>Compress File</label>
    </mdc-form-field>
    <div class="div-max-width"></div>
    <button mdc-button data-mdc-dialog-action="ok" click.trigger="load()"
        disabled.bind="compress && (targetWidthError || qualityError)">Load</button>
</mdc-dialog-actions>
